name: novacore-lesson02
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - '127.0.0.1:${LESSON02_REDIS_PORT:-16379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novacore
      POSTGRES_USER: novacore
      # Credencial pública somente para infraestrutura didática local.
      POSTGRES_PASSWORD: '${LESSON02_POSTGRES_PASSWORD:-novacore_demo_only}'
    ports:
      - '127.0.0.1:${LESSON02_POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  redis_data:
  postgres_data:
