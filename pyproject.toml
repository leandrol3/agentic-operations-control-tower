[project]
name = "agentic-operations-control-tower"
version = "0.1.0"
description = "NovaCore — laboratório progressivo de engenharia multiagente"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.11,<3",
    "openai>=2,<3",
]

[project.scripts]
control-tower = "control_tower.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_tower"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
